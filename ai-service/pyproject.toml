[project]
name = "swasthyaflow-ai"
version = "1.0.0"
description = "Data-driven, non-diagnostic patient severity / triage decision-support service for SwasthyaFlow."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    "joblib>=1.3",
    "pandas>=2.2",
    "transformers>=4.44",
    "torch>=2.2",
    "sentencepiece>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
